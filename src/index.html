<!DOCTYPE html>
<html>
<head>
<meta charset=utf-8/>
<title>Lab 1. Introduction to HTML5 and HLS</title>
  
  <!--
  Embed needed js libraries for video player. Note, libraries needs to be hosted on your server, under /js folder.
   -->
  <link rel="stylesheet" href="css/style.css">
   


</head>
<body>
  <h1>My first HLS player</h1>
  

<video id="videoPlayer" width="640" height="360" controls></video>

<br><br>

	<button type="button" id="playBtn">Play</button>
	<button type="button" id="pauseBtn">Pause</button>
	<button type="button" id="stopBtn">Stop</button>
	<button type="button" id="forwardBtn">Jump to 5 sec forward</button>
	<button type="button" id="backwardBtn">Jump to 5 sec backwards</button>	
	
	<p>Playlist</p>
	
	<input type="text" name="url1" size="100" value="https://d2zihajmogu5jn.cloudfront.net/bipbop-advanced/bipbop_16x9_variant.m3u8">
  <button type="button" id="load1">Load</button><br>
	<input type="text" name="url2" size="100" value="https://d2zihajmogu5jn.cloudfront.net/bipbop-advanced/bipbop_16x9_variant.m3u8">
  <button type="button" id="load2">Load</button><br>
	<button type="button" id="shuffleBtn">Shuffle</button>

  <script src="js/control.js"></script>
</body>
</html>
